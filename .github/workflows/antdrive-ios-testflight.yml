# AntDrive iOS → TestFlight.
#
# Archives examples/ios-drive for devices (the Xcode build phase
# cross-compiles crates/ant-ffi with the `chain` feature), signs it with
# Xcode's cloud-managed signing, and uploads the build to App Store
# Connect, where it shows up in TestFlight once Apple has processed it
# (usually 10-30 minutes).
#
# Signing: the archive is built unsigned (CODE_SIGNING_ALLOWED=NO) by
# .github/scripts/ios-archive.py, shared with the other app's TestFlight
# workflow, and only the export signs it, with the cloud-managed Apple
# Distribution certificate. Archiving with the project's Automatic
# signing instead made Xcode create a new "Apple Development: Created
# via API" certificate on every fresh runner, which filled the team's
# development-certificate cap after a few releases (issue #230). An
# unsigned archive loses the target's entitlements, so the script
# re-applies its CODE_SIGN_ENTITLEMENTS file to the archived app with an
# ad-hoc signature, which the export keeps.
#
# The job then waits for that processing (up to 45 minutes) and attaches
# the build to the app's editable iOS App Store version ("Prepare for
# Submission", or a rejected one), the step App Store Connect's web UI
# calls "Add Build"; the app's icon there comes from that build.
# Nothing is submitted for review. If no version is editable (one is in
# review), the build stays unattached and the job says so in a notice.
# The logic lives in .github/scripts/asc-attach-build.py, shared with the
# other app's TestFlight workflow, and runs in its own `attach` job after
# the upload job. A failed attach fails that job (the upload itself has
# already landed and stays in TestFlight). Attach jobs of overlapping
# runs queue; when several are pending, only the newest runs, and the
# version is never moved back to an older build. Uploads never queue, so
# every tag still gets its own TestFlight build.
#
# Runs on every release tag (`v*`, next to release.yml and
# release-ios.yml) and by hand from the Actions tab.
#
# Needs three repository secrets, from an App Store Connect API key with
# the Admin role (cloud signing creates the distribution certificate and
# profile, which App Manager keys may not):
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the key list
#   ASC_KEY_P8      the contents of the downloaded AuthKey_<id>.p8
# Without them the job says so and succeeds without uploading, so a tag
# release never fails over it. The app record for
# baby.freedom.antdrive (team 46XPHRBLH5) must exist in App Store
# Connect.
#
# Version: 0.1.<run number>, build <run number>, so every upload is new
# to App Store Connect.
#
# Kept separate from antstream-ios-testflight.yml (not a matrix leg) so
# one app failing to archive or upload never hides the other. Both share
# the ASC_* secrets; only the app record differs.
#
# One-time setup (AntDrive has no README, so it lives here; the AntStream
# README's "TestFlight" section describes the same steps):
#   1. In App Store Connect, create the app record for
#      baby.freedom.antdrive (team 46XPHRBLH5) if it doesn't exist.
#   2. The ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 secrets AntStream
#      already uses cover this workflow too; nothing else to add.

name: antdrive-ios-testflight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  testflight:
    name: archive AntDrive + upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check App Store Connect credentials
        id: creds
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 are not set: skipping the TestFlight upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'

      - name: Install Rust toolchain
        if: steps.creds.outputs.ok == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo registry + target
        if: steps.creds.outputs.ok == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: antdrive-testflight

      - name: Select newest Xcode
        if: steps.creds.outputs.ok == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Write the API key
        if: steps.creds.outputs.ok == 'true'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        if: steps.creds.outputs.ok == 'true'
        working-directory: examples/ios-drive
        # No -allowProvisioningUpdates and no API key: nothing here may
        # ask Apple for a certificate. See the header.
        run: |
          python3 ../../.github/scripts/ios-archive.py \
            --project AntDrive.xcodeproj --scheme AntDrive \
            --archive-path "$RUNNER_TEMP/AntDrive.xcarchive" \
            --version "0.1.${{ github.run_number }}" \
            --build "${{ github.run_number }}"

      - name: Export and upload to App Store Connect
        id: upload
        if: steps.creds.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>46XPHRBLH5</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AntDrive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::AntDrive 0.1.${{ github.run_number }} (build ${{ github.run_number }}) uploaded; it appears in TestFlight once Apple has processed it."
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Remove the API key
        if: always() && steps.creds.outputs.ok == 'true'
        run: rm -f "$ASC_KEY_PATH"

  # A separate job so the queue below holds back only the attach, never
  # an upload: GitHub keeps one *pending* job per concurrency group and
  # cancels an older pending one when a newer one queues, so a group on
  # the upload job would skip a release tag's TestFlight build outright.
  # Here the cancelled job is only an older build's attach; its build is
  # still in TestFlight, and the newer build is what the version should
  # carry anyway. The script also leaves the version alone if it already
  # has a newer build, so a run that finishes processing last can't
  # overwrite a newer one either.
  attach:
    name: attach the build to the App Store version
    needs: testflight
    if: needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    # Up to 45 minutes waiting for Apple's processing, plus retries.
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-attach
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Write the API key
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Attach the build to the App Store version
        # Standard library only (the token is signed by the system
        # openssl), so nothing from PyPI runs next to the Admin key. A
        # failure (revoked key, INVALID build, processing timeout, a
        # refused PATCH) fails the job: Apple accepts 0.1.<run> builds
        # on the "1.0" version (confirmed 2026-10-19, HTTP 204), so
        # there is no known-benign refusal to soften.
        run: |
          python3 .github/scripts/asc-attach-build.py \
            --bundle-id baby.freedom.antdrive \
            --version "0.1.${{ github.run_number }}" \
            --build "${{ github.run_number }}"

      - name: Remove the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
