# AntStream simulator evidence (issue #70).
#
# Builds the iOS example app for the simulator on a macOS runner, boots a
# simulator, launches the app, and uploads screenshots + app log as
# artifacts — so PRs touching examples/ios-stream get build verification
# and visual evidence despite the orchestrator running on Linux.
#
# Device-only paths (camera/broadcast) and real iCloud Keychain sync are
# out of scope — those stay manual.

name: antstream-visual

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/ios-stream/**"
      - ".github/workflows/antstream-visual.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  simulator-evidence:
    name: build AntStream + simulator screenshots
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: antstream-visual

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      # The live screen's frame-shape decision (#214), compiled on its own
      # with its tests: the app has no test target, and the simulator has
      # no camera to drive the preview path with.
      - name: Preview geometry unit tests
        working-directory: examples/ios-stream
        run: |
          mkdir -p build
          swiftc -parse-as-library AntStream/PreviewGeometry.swift \
            ci/preview-geometry-tests.swift -o build/preview-geometry-tests
          build/preview-geometry-tests

      # The solar-punk channel (#217): link parsing, the links a channel
      # is shared by, the Watch tab's playlist rewrite and the publisher
      # config, plus the stream info and the catalog entry the Watch tab
      # reads (#220, against crates/ant-ffi/testdata/catalog). Pure Swift,
      # compiled on its own with its tests.
      - name: Channel address unit tests
        working-directory: examples/ios-stream
        run: |
          mkdir -p build
          swiftc -parse-as-library AntStream/ChannelAddress.swift \
            ci/channel-address-tests.swift -o build/channel-address-tests
          build/channel-address-tests

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/^ +//; s/ \([-A-F0-9]+\).*$//')
          if [ -z "$DEVICE" ]; then
            echo "no iPhone simulator available"; xcrun simctl list devices; exit 1
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "picked: $DEVICE"

      - name: Build for simulator
        working-directory: examples/ios-stream
        run: |
          xcodebuild -project AntStream.xcodeproj -scheme AntStream \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build build

      - name: Launch and capture screenshots
        working-directory: examples/ios-stream
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "AntStream.app" | head -1)
          [ -n "$APP" ] || { echo "app not found"; exit 1; }
          xcrun simctl boot "${{ steps.sim.outputs.device }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.device }}" -b
          xcrun simctl install booted "$APP"
          xcrun simctl launch booted baby.freedom.antstream
          mkdir -p shots
          # The app's first frame, before the node has settled: the Go
          # live gate and the readiness checklist must agree here too,
          # however far the setup got. (Peers land fast on a runner —
          # airplane mode / zero peers stays a manual device check.)
          sleep 3
          xcrun simctl io booted screenshot shots/00-cold-start.png
          sleep 17
          xcrun simctl io booted screenshot shots/01-first-screen.png
          sleep 25
          xcrun simctl io booted screenshot shots/02-after-node-start.png
          # Relaunch straight into the throughput-bench sheet (#67
          # stage 1). iOS parses `-key value` launch arguments into
          # UserDefaults, which is the only way to reach a sheet here:
          # the runner has no tap driver, and a screenshot of the
          # button alone doesn't show that the sheet renders.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstreamShowBench YES
          sleep 12
          xcrun simctl io booted screenshot shots/03-bench-sheet.png
          # …and once more with a 60 s run started on appear, so the
          # evidence covers the bench actually measuring (the whole
          # FFI round trip: ant_bench_start -> _progress -> _stop) and
          # not just the form that starts it. The simulator has no
          # storage plan, so this is the no-network pipeline mode.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstreamShowBench YES -antstreamBenchSeconds 60
          # The sheet waits for `ant_init` before starting (~20 s on a
          # cold launch), so the first shot is ~25 s into the run and
          # the second is after it has finished and reported.
          sleep 45
          xcrun simctl io booted screenshot shots/04-bench-running.png
          sleep 60
          xcrun simctl io booted screenshot shots/05-bench-report.png
          # And the report state a stopped-too-early run reaches: the
          # run is cut 3 s in, inside the 5 s warm-up, so the measured
          # window is empty. The card has to say so instead of showing
          # a 0.00 Mbit/s run as having sustained the rendition.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstreamShowBench YES -antstreamBenchSeconds 60 \
            -antstreamBenchStopAfter 3
          sleep 45
          xcrun simctl io booted screenshot shots/06-bench-stopped-in-warmup.png
          # --- Storage / settlement surfaces (PR #75) ---
          # A screenshot captures only whatever the app opens *to*, and the
          # runner has no tap driver, so each Storage surface is reached by
          # its own launch argument (parsed once into RootView.shotArgs)
          # rather than by driving the tab bar. See RootView.swift.
          #
          # 07 — Storage tab on a fresh account: the storage meter's
          # no-plan state and the "Set up storage" card — whatever #75
          # renders for settlement when the account has no plan yet.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstream-shot-storage
          sleep 22
          xcrun simctl io booted screenshot shots/07-storage-overview.png
          # 08 — the buy flow (Get Started) plan picker: the storage plans
          # and their prices. Pricing needs the network; the layout renders
          # regardless, so this honestly shows whatever the runner quotes
          # from the public Gnosis RPC (a spinner/chevron if it can't).
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstream-shot-getstarted
          sleep 20
          xcrun simctl io booted screenshot shots/08-storage-getstarted-plans.png
          # 09 — the buy flow's payment step: "Send exactly" + the amount,
          # the "on Gnosis Chain" badge, the EIP-681 QR code, the short
          # address with Copy and the "Waiting for payment" status. A live
          # quote needs funds and a reachable chain, so this is driven with
          # a representative quote. The one-time settlement-deposit line
          # (#75) moved behind the ⓘ; shot 16 captures it there.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-getstarted -antstream-shot-getstarted-pay
          sleep 20
          xcrun simctl io booted screenshot shots/09-storage-getstarted-deposit.png
          # 10 — the Storage tab's deposit-0 top-up card: #75's migration
          # surface for installs whose chequebook was deployed unfunded
          # ("Broadcasts will stall without a deposit" → Add deposit). A
          # fresh simulator account has no chequebook to be under-funded,
          # so representative sample state is published to reach the card.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-storage -antstream-shot-deposit
          sleep 22
          xcrun simctl io booted screenshot shots/10-storage-deposit-topup.png
          # --- Going live (#67 stage 2 / #65) ---
          # 11/12 — the broadcast screen with a broadcast actually
          # running. A simulator has no camera, so `-antstream-shot-live`
          # runs the capture pipeline from the generated test pattern
          # (labelled as such on screen) through the real encoder,
          # segmenter and publisher: AVAssetWriter in .mpeg4AppleHLS mode
          # -> ant_publisher_push_segment -> POST /bzz. It also installs
          # a sample connected plan, because a fresh runner account has
          # none and the screen refuses to go live without one.
          #
          # The uploads themselves cannot succeed here: the sample batch
          # is not a real postage batch, so the gateway rejects it —
          # exactly the "no usable batch" wall the stage-1 publish rows
          # hit. That is the honest evidence this runner can produce, and
          # it still covers everything up to the batch check: capture,
          # segmentation, the FFI hand-off, the lag indicator and the
          # error surface.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstream-shot-live
          # The screen waits for `ant_init` before starting (~20 s cold).
          sleep 40
          xcrun simctl io booted screenshot shots/11-live-broadcast.png
          # This run passes a 10-minute reap_ms (see
          # `AntNode.reapMsForThisLaunch`): nothing is ever listed here
          # (the sample batch is rejected), so the real 60 s window (#172)
          # would end the broadcast before these shots.
          sleep 30
          xcrun simctl io booted screenshot shots/12-live-publish-lag.png
          # 18/19 — a dropped connection (#172): `-antstream-shot-live-
          # paused` pauses the broadcast 5 s in, as the path monitor does
          # when the device goes offline. 18 is the paused state (still
          # LIVE, "No connection — paused"); the "network" returns 65 s
          # after the pause, past the reap window, and 19 is after that
          # return, when the reap held for it ended the broadcast
          # (summary: "nothing reached viewers for a minute"). A reap
          # never fires while offline: its closing uploads need the
          # uplink. A real return inside the window needs a device: this
          # runner can't land a segment at all.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-live -antstream-shot-live-paused
          sleep 45
          xcrun simctl io booted screenshot shots/18-live-paused.png
          sleep 90
          xcrun simctl io booted screenshot shots/19-live-reaped.png
          # --- Android parity (permanent channel, Watch tab, quality,
          # payment help) ---
          # 13 — the Broadcast tab's "Your channel" card: the account's
          # address and the `antstream` topic (#217), its web player link
          # and swarm:// URI, with Share / Watch. A runner account has no
          # plan, so `-antstream-shot-channel` installs a sample plan for
          # the checklist next to it (nothing persisted).
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstream-shot-channel
          sleep 25
          xcrun simctl io booted screenshot shots/13-broadcast-channel-card.png
          # 20 — the Broadcast tab after a relaunch that finds a broadcast
          # the app was killed in the middle of (#175): the "Unfinished
          # broadcast" card with Resume / End broadcast / Discard, and Go
          # live held until it is dealt with. A runner never has a
          # broadcast killed under it, so `-antstream-shot-unfinished`
          # installs a sample entry (nothing on disk).
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstream-shot-unfinished
          sleep 25
          xcrun simctl io booted screenshot shots/20-broadcast-unfinished.png
          # 20b — the same card for an entry kept only because the closing
          # `vod` catalog entry failed after the recording landed (#220):
          # it says the recording is on the channel, and Go live is not
          # held for it.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-unfinished -antstream-shot-unfinished-recorded
          sleep 25
          xcrun simctl io booted screenshot shots/20b-broadcast-unfinished-recorded.png
          # 14/15 — the Watch tab playing a channel through the in-process
          # gateway. The sample channel (an owner nobody broadcasts as,
          # topic `antstream`) has no feed, so this
          # captures the player loading and then the plain-language retry
          # state a channel that isn't live yet ends up in.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstream-shot-watch
          sleep 30
          xcrun simctl io booted screenshot shots/14-watch-loading.png
          sleep 60
          xcrun simctl io booted screenshot shots/15-watch-retrying.png
          # 16 — the payment step's ⓘ sheet: full address, copy buttons,
          # the Gnosis-only warning, the deposit line and "activates by
          # itself".
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-getstarted -antstream-shot-getstarted-pay \
            -antstream-shot-getstarted-help
          sleep 30
          xcrun simctl io booted screenshot shots/16-getstarted-pay-help.png
          # 17 — the live screen before going live: the quality presets
          # (360p / 540p / 720p) and what each costs in bandwidth, over
          # the preview (#193). A simulator has no camera, so the preview
          # is its placeholder, drawn in the broadcast's frame (9:16 for
          # a phone held upright) and saying why there is no picture.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstream-shot-live-idle
          sleep 25
          xcrun simctl io booted screenshot shots/17-live-quality-picker.png
          # 21/22 — a nearly full storage plan (#176). A runner account
          # has no plan, so `-antstream-shot-low-capacity` makes the
          # sample one immutable with about twenty minutes of 360p left in
          # its fullest bucket: the Broadcast checklist's "Room for a
          # broadcast" row (scrolled into view) and the going-live
          # screen's line under the quality picker both warn. (Shots 11/12
          # show the other half: the sample batch is not a real one, so
          # every upload is refused and the live screen names the plan,
          # not the network.)
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-channel -antstream-shot-low-capacity
          sleep 25
          xcrun simctl io booted screenshot shots/21-broadcast-low-capacity.png
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-live-idle -antstream-shot-low-capacity
          sleep 25
          xcrun simctl io booted screenshot shots/22-live-low-capacity.png
          # 23/24 — a plan Swarm won't stamp with at all (#176): the
          # sample batch reads `usable: false` (and is not propagating),
          # so the same two surfaces say "Swarm won't accept this plan's
          # stamps" in orange instead of a time estimate.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-channel -antstream-shot-unusable-plan
          sleep 25
          xcrun simctl io booted screenshot shots/23-broadcast-unusable-plan.png
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-live-idle -antstream-shot-unusable-plan
          sleep 25
          xcrun simctl io booted screenshot shots/24-live-unusable-plan.png
          # --- Credit card: account wallet, add / withdraw (#165) ---
          # A fresh runner account has no chequebook or wallet funds, so
          # `-antstream-shot-credit` publishes the state #165 was filed
          # from (5.76 xBZZ in the wallet, a nearly spent chequebook); the
          # `-add` / `-withdraw` / `-confirm` variants open the amount
          # sheet and the confirmation. Nothing is sent: the confirm
          # button is never pressed.
          # 25 — the card: credit figures + the account wallet + actions.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-storage -antstream-shot-credit
          sleep 22
          xcrun simctl io booted screenshot shots/25-credit-wallet.png
          # 26 — "Add to credit": amount field, quick picks, gas note.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-storage -antstream-shot-credit -antstream-shot-credit-add
          sleep 22
          xcrun simctl io booted screenshot shots/26-credit-add-sheet.png
          # 27 — the confirmation before the real transaction.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-storage -antstream-shot-credit -antstream-shot-credit-add \
            -antstream-shot-credit-confirm
          sleep 24
          xcrun simctl io booted screenshot shots/27-credit-add-confirm.png
          # 28 — "Withdraw to account", capped at the free credit.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-storage -antstream-shot-credit -antstream-shot-credit-withdraw
          sleep 22
          xcrun simctl io booted screenshot shots/28-credit-withdraw-sheet.png
          # --- Orientation (#193) ---
          # The runner can't turn the simulator, so `-antstream-shot-
          # landscape` has the live screen turn its interface to
          # landscape (`requestGeometryUpdate`), as a turned phone does.
          # 29 — before going live: the controls re-laid out side by
          # side, the preview placeholder in a 16:9 frame, and "Landscape
          # broadcast, as the phone is held".
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-live-idle -antstream-shot-landscape
          sleep 25
          xcrun simctl io booted screenshot shots/29-live-idle-landscape.png
          # 30 — live in landscape (the test pattern, as in 11/12): the
          # metrics card and the Stop button laid out for landscape.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-live -antstream-shot-landscape
          sleep 45
          xcrun simctl io booted screenshot shots/30-live-landscape.png
          # --- Stream info (#220) ---
          # A runner account has no stream info, no photo library and no
          # camera, so `-antstream-shot-info` installs sample info (a
          # title, a description, a drawn thumbnail and a start tomorrow
          # at 08:00, announced) with the channel sample's plan. Nothing
          # is saved, uploaded or announced.
          # 33: the Broadcast tab's stream info card, scrolled into view.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream -antstream-shot-info
          sleep 25
          xcrun simctl io booted screenshot shots/33-broadcast-stream-info.png
          # 34: the stream info editor, filled in: title, description,
          # thumbnail, the scheduled start and Announce.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-info -antstream-shot-info-edit
          sleep 25
          xcrun simctl io booted screenshot shots/34-stream-info-editor.png
          # 35: the Watch tab with the channel's catalog entry over the
          # player: its title, description and announced start. The
          # sample channel has no catalog feed, so
          # `-antstream-shot-watch-info` installs a sample entry.
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-watch -antstream-shot-watch-info
          sleep 30
          xcrun simctl io booted screenshot shots/35-watch-catalog-info.png
          # 36/37: an announcement still being written (R2-M2):
          # `-antstream-shot-info-announcing` holds the sample's
          # announcement in flight. 36: the Broadcast tab's Go live held,
          # saying why. 37: the editor, Cancel and Save held, "Announcing…".
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-info -antstream-shot-info-announcing
          sleep 25
          xcrun simctl io booted screenshot shots/36-broadcast-announcing.png
          xcrun simctl terminate booted baby.freedom.antstream || true
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-info -antstream-shot-info-edit -antstream-shot-info-announcing
          sleep 25
          xcrun simctl io booted screenshot shots/37-stream-info-announcing.png
          xcrun simctl spawn booted log show --last 5m \
            --predicate 'processImagePath contains "AntStream"' \
            > shots/app-log.txt || true

      # --- Portrait broadcast (#194) ---
      # A portrait broadcast must be encoded as real portrait frames
      # (360x640, identity track matrix), not as landscape frames the
      # picture was squeezed into. `-antstream-shot-portrait` runs the
      # test pattern through the real writer as a phone held upright
      # would (it sets the broadcast's orientation, fixed at Go live
      # since #193, whatever the layout); the step reads the app's own on-disk segment ring (the same
      # bytes the publisher uploads), checks the init segment's geometry,
      # and grabs a frame as AVFoundation presents it: the pattern's white
      # disc must be round in a portrait frame. The camera path's rotation
      # (AVCaptureConnection.videoRotationAngle) needs a device.
      - name: Portrait broadcast geometry
        working-directory: examples/ios-stream
        run: |
          set -euo pipefail
          SEGS="$(xcrun simctl get_app_container booted baby.freedom.antstream data)/Library/Caches/antstream/segments"
          xcrun simctl terminate booted baby.freedom.antstream || true
          rm -rf "$SEGS"
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-live -antstream-shot-portrait
          sleep 45
          xcrun simctl io booted screenshot shots/31-live-portrait.png
          xcrun simctl terminate booted baby.freedom.antstream || true
          mkdir -p shots/portrait
          ls -l "$SEGS"
          cp "$SEGS"/* shots/portrait/
          INIT=$(ls "$SEGS"/init-*.mp4 | sort -V | head -1)
          N=${INIT##*/init-}; N=${N%.mp4}
          # The init segment and the media segments that follow it, as one
          # fragmented MP4.
          { cat "$INIT"; for i in $(seq $((N + 1)) $((N + 5))); do
              f="$SEGS/seg-$i.m4s"; [ -f "$f" ] && cat "$f"; done; } > shots/portrait/portrait.mp4
          python3 ci/mp4-geometry.py --expect portrait "$INIT" | tee shots/portrait/geometry.txt
          swift ci/frame-grab.swift shots/portrait/portrait.mp4 shots/32-portrait-frame.png 2 \
            | tee -a shots/portrait/geometry.txt
          # The other way round: a broadcast started with the interface in
          # landscape (no portrait flag) is encoded 640x360, so the check
          # above passes because the orientation reached the writer, not
          # because every broadcast comes out portrait.
          xcrun simctl terminate booted baby.freedom.antstream || true
          rm -rf "$SEGS"
          xcrun simctl launch booted baby.freedom.antstream \
            -antstream-shot-live -antstream-shot-landscape
          sleep 45
          xcrun simctl terminate booted baby.freedom.antstream || true
          mkdir -p shots/landscape
          cp "$SEGS"/* shots/landscape/
          INIT=$(ls "$SEGS"/init-*.mp4 | sort -V | head -1)
          python3 ci/mp4-geometry.py --expect landscape "$INIT" | tee shots/landscape/geometry.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antstream-simulator-evidence
          path: examples/ios-stream/shots/
          if-no-files-found: error
