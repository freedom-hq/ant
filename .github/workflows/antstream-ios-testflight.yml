# AntStream iOS → TestFlight.
#
# Archives examples/ios-stream for devices (the Xcode build phase
# cross-compiles crates/ant-ffi with the `chain` feature), signs it with
# Xcode's cloud-managed signing, and uploads the build to App Store
# Connect, where it shows up in TestFlight once Apple has processed it
# (usually 10-30 minutes).
#
# The job then waits for that processing (up to 45 minutes) and attaches
# the build to the app's editable iOS App Store version ("Prepare for
# Submission", or a rejected one), the step App Store Connect's web UI
# calls "Add Build"; the app's icon there comes from that build.
# Nothing is submitted for review. If no version is editable (one is in
# review), the build stays unattached and the job says so in a notice.
# The logic lives in .github/scripts/asc-attach-build.py, shared with the
# other app's TestFlight workflow.
#
# Runs on every release tag (`v*`, next to release.yml and
# release-ios.yml) and by hand from the Actions tab.
#
# Needs three repository secrets, from an App Store Connect API key with
# the Admin role (cloud signing creates the distribution certificate and
# profile, which App Manager keys may not):
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the key list
#   ASC_KEY_P8      the contents of the downloaded AuthKey_<id>.p8
# Without them the job says so and succeeds without uploading, so a tag
# release never fails over it. The app record for
# baby.freedom.antstream (team 46XPHRBLH5) must exist in App Store
# Connect.
#
# Version: 0.1.<run number>, build <run number>, so every upload is new
# to App Store Connect.

name: antstream-ios-testflight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  testflight:
    name: archive AntStream + upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 150
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check App Store Connect credentials
        id: creds
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 are not set: skipping the TestFlight upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'

      - name: Install Rust toolchain
        if: steps.creds.outputs.ok == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo registry + target
        if: steps.creds.outputs.ok == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: antstream-testflight

      - name: Select newest Xcode
        if: steps.creds.outputs.ok == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Write the API key
        if: steps.creds.outputs.ok == 'true'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive
        if: steps.creds.outputs.ok == 'true'
        working-directory: examples/ios-stream
        run: |
          xcodebuild archive \
            -project AntStream.xcodeproj -scheme AntStream -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AntStream.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to App Store Connect
        if: steps.creds.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>46XPHRBLH5</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AntStream.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::AntStream 0.1.${{ github.run_number }} (build ${{ github.run_number }}) uploaded; it appears in TestFlight once Apple has processed it."

      - name: Attach the build to the App Store version
        if: steps.creds.outputs.ok == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet 'pyjwt[crypto]'
          "$RUNNER_TEMP/asc-venv/bin/python" .github/scripts/asc-attach-build.py \
            --bundle-id baby.freedom.antstream \
            --version "0.1.${{ github.run_number }}" \
            --build "${{ github.run_number }}"

      - name: Remove the API key
        if: always() && steps.creds.outputs.ok == 'true'
        run: rm -f "$ASC_KEY_PATH"
