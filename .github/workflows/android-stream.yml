name: AntStream Android APK

# Builds the AntStream Android example app (`examples/android-stream`):
# cross-compiles `crates/ant-ffi` (features `jni,chain`) for arm64 phones,
# assembles a release APK signed with the
# example key, uploads it as a workflow artifact and publishes it on the
# rolling `antstream-android-latest` prerelease, so a phone can download
# it straight from GitHub.

on:
  push:
    branches: [main, "antstream-android*"]
    paths:
      - "examples/android-stream/**"
      - "crates/**"
      - "xtask/**"
      - "Cargo.lock"
      - ".github/workflows/android-stream.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-stream-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_API_LEVEL: "26"

jobs:
  apk:
    name: build AntStream APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The native library only depends on the Rust sources. When none of
      # them changed since a previous build, its .so is restored from the
      # cache and the whole Rust toolchain is skipped: app-only changes
      # build in about two minutes.
      - name: Restore libant_ffi.so
        id: so-cache
        uses: actions/cache@v4
        with:
          path: examples/android-stream/app/src/main/jniLibs
          key: antstream-so-arm64-${{ hashFiles('crates/**', 'Cargo.lock', 'Cargo.toml', 'xtask/**') }}

      - name: Install Rust toolchain
        if: steps.so-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry + target
        if: steps.so-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-stream

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;27.2.12479018

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        if: steps.so-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      # arm64 only: that is every phone this ships to. The x86_64 slice is
      # for the emulator; build it locally with
      # `cargo xtask build-android-x86_64 --features chain --app android-stream`.
      - name: Build libant_ffi.so (arm64)
        if: steps.so-cache.outputs.cache-hit != 'true'
        run: cargo xtask build-android-arm64 --features chain --app android-stream

      - name: Verify exported JNI symbols
        run: |
          set -euo pipefail
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SO="examples/android-stream/app/src/main/jniLibs/arm64-v8a/libant_ffi.so"
          count=$("$NM" -D --defined-only "$SO" | grep -c ' T Java_at_vibing_ant_stream_AntNative_native' || true)
          echo "AntNative JNI symbols: $count"
          test "$count" -eq 28

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle's dependency downloads and build cache across runs.
      # By default it only *saves* on the default branch; this app is built
      # from its feature branch too, so let every build save.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Assemble release APK
        working-directory: examples/android-stream
        run: |
          VERSION_CODE=${{ github.run_number }}
          ./gradlew assembleRelease \
            -Pantstream.versionCode="$VERSION_CODE" \
            -Pantstream.versionName="0.1.$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/AntStream.apk"
          ls -lh "$GITHUB_WORKSPACE/AntStream.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AntStream-apk
          path: AntStream.apk

      - name: Publish as a versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="0.1.${{ github.run_number }}"
          TAG="antstream-android-v$VERSION"
          NOTES="AntStream for Android $VERSION, built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Example app, signed with the public example key in examples/android-stream. Install AntStream-$VERSION.apk on an arm64 phone (Android 8+)."
          cp AntStream.apk "AntStream-$VERSION.apk"
          gh release create "$TAG" "AntStream-$VERSION.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "AntStream Android $VERSION" --notes "$NOTES"
