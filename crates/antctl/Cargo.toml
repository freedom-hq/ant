[package]
name = "antctl"
version = "0.5.79"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "antctl"
path = "src/main.rs"

[dependencies]
ant-chain = { path = "../ant-chain" }
ant-control = { path = "../ant-control" }
ant-crypto = { path = "../ant-crypto" }
ant-retrieval = { path = "../ant-retrieval" }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
crossterm = "0.29.0"
dirs = "6.0.0"
hex.workspace = true
memmap2 = "0.9.10"
percent-encoding = "2.3"
primitive-types = { version = "0.14.0", default-features = false }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# `get -o <dir> --force` opens the target with `O_NOFOLLOW|O_NONBLOCK`
# so it neither follows a symlink nor blocks on a FIFO.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
